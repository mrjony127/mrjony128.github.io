    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      background: #0f1117;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 14px;
      padding: 3px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .subtitle {
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #1a1d29;
      border: 1px solid #2a2e3f;
      border-radius: 14px;
      padding: 16px 8px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: #f1f5f9;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }

    .card:hover {
      background: #22263a;
      border-color: #6366f1;
      transform: translateY(-2px);
    }

    .card:active {
      transform: scale(0.97);
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      background: #252a3d;
    }

    .name {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      text-align: center;
      letter-spacing: 0.2px;
    }

    .footer {

      color: #334155;
      font-size: 11px;
    }
